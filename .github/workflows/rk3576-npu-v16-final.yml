name: RK3576 NPU v16 final (test only)

on:
  push:
    branches: [rk3576-npu-v16-final]
  workflow_dispatch:

jobs:
  rock-4d-kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
      - uses: actions/checkout@v4
      - name: Build the kernel packages
        run: |
          ./compile.sh kernel BOARD=radxa-rock-4d BRANCH=edge \
            PREFER_DOCKER=no EXPERT=yes KERNEL_CONFIGURE=no
      - uses: actions/upload-artifact@v4
        with:
          name: rock-4d-kernel-debs
          path: output/debs/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rock-4d-build-logs
          path: output/logs/

  cm5-io-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./compile.sh build BOARD=armsom-cm5-io BRANCH=edge RELEASE=trixie \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz PREFER_DOCKER=no EXPERT=yes
      - uses: actions/upload-artifact@v4
        with:
          name: armsom-cm5-io-edge-trixie-minimal
          path: output/images/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cm5-io-build-logs
          path: output/logs/
