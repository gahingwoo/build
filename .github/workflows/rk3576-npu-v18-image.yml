name: RK3576 NPU v18 ROCK 4D image (test only)

on:
  push:
    branches: [rk3576-npu-v18-image]
  workflow_dispatch:

jobs:
  rock-4d-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - name: Build the image
        run: |
          ./compile.sh build BOARD=radxa-rock-4d BRANCH=bleedingedge \
            RELEASE=trixie BUILD_MINIMAL=yes BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no EXPERT=yes PREFER_DOCKER=no \
            COMPRESS_OUTPUTIMAGE=sha,xz
      - uses: actions/upload-artifact@v4
        with:
          name: rock-4d-image
          path: output/images/
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rock-4d-image-logs
          path: output/logs/
