name: qosA-ci

on:
  push:
    branches: [qosA-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        board: [armsom-cm5-io]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: |
          ./compile.sh build BOARD=${{ matrix.board }} BRANCH=edge RELEASE=trixie \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz PREFER_DOCKER=no EXPERT=yes

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-edge-trixie-minimal
          path: output/images/
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ matrix.board }}
          path: output/logs/
