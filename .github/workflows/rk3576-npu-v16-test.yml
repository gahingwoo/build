name: Build the edge kernel with the RK3576 NPU v16 test delta

on:
  push:
    branches: [rk3576-npu-v16-test]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Build the kernel packages
        run: |
          ./compile.sh kernel BOARD=armsom-cm5-io BRANCH=edge \
            PREFER_DOCKER=no EXPERT=yes KERNEL_CONFIGURE=no

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-debs
          path: output/debs/
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: output/logs/
