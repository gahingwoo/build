name: Build a ROCK 4D edge image with the RK3576 NPU v16 test delta

on:
  push:
    branches: [rk3576-npu-v16-test]
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: |
          ./compile.sh build BOARD=radxa-rock-4d BRANCH=edge RELEASE=trixie \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=sha,img,xz PREFER_DOCKER=no EXPERT=yes

      - uses: actions/upload-artifact@v4
        with:
          name: radxa-rock-4d-edge-trixie-minimal
          path: output/images/
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: output/logs/
